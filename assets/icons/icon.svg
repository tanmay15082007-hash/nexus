<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d1a2e"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="outerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="roundedSquare">
      <rect x="0" y="0" width="512" height="512" rx="96" ry="96"/>
    </clipPath>
  </defs>

  <!-- Deep Space Rounded Square Background -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Subtle radial glow overlay -->
  <circle cx="256" cy="256" r="220" fill="rgba(34,211,238,0.06)"/>
  <circle cx="256" cy="256" r="160" fill="rgba(168,85,247,0.05)"/>

  <!-- Outer hexagon ring (stroke) -->
  <polygon points="256,76 404,166 404,346 256,436 108,346 108,166"
           fill="none"
           stroke="url(#hexGrad)"
           stroke-width="3"
           stroke-opacity="0.55"
           filter="url(#outerGlow)"/>

  <!-- Middle hexagon ring -->
  <polygon points="256,112 372,180 372,332 256,400 140,332 140,180"
           fill="none"
           stroke="#22d3ee"
           stroke-width="1.5"
           stroke-opacity="0.35"
           stroke-dasharray="12 8"/>

  <!-- Hexagon fill (glass) -->
  <polygon points="256,142 356,198 356,314 256,370 156,314 156,198"
           fill="rgba(13,26,50,0.72)"
           stroke="url(#hexGrad)"
           stroke-width="2.5"/>

  <!-- Core glow orb -->
  <circle cx="256" cy="256" r="72" fill="url(#coreGrad)" fill-opacity="0.18" filter="url(#outerGlow)"/>
  <circle cx="256" cy="256" r="52" fill="url(#coreGrad)" fill-opacity="0.28"/>
  <circle cx="256" cy="256" r="36" fill="rgba(34,211,238,0.5)" filter="url(#innerGlow)"/>
  <circle cx="256" cy="256" r="22" fill="#22d3ee" fill-opacity="0.9"/>

  <!-- N letter mark in center -->
  <text x="256" y="273"
        text-anchor="middle"
        font-family="'Orbitron', 'Arial', sans-serif"
        font-size="38"
        font-weight="900"
        fill="#030712"
        letter-spacing="2">N</text>

  <!-- Corner accent marks -->
  <line x1="256" y1="142" x2="256" y2="168" stroke="#22d3ee" stroke-width="2.5" stroke-opacity="0.7"/>
  <line x1="356" y1="198" x2="336" y2="209" stroke="#22d3ee" stroke-width="2.5" stroke-opacity="0.7"/>
  <line x1="356" y1="314" x2="336" y2="303" stroke="#a855f7" stroke-width="2.5" stroke-opacity="0.7"/>
  <line x1="256" y1="370" x2="256" y2="344" stroke="#a855f7" stroke-width="2.5" stroke-opacity="0.7"/>
  <line x1="156" y1="314" x2="176" y2="303" stroke="#a855f7" stroke-width="2.5" stroke-opacity="0.7"/>
  <line x1="156" y1="198" x2="176" y2="209" stroke="#22d3ee" stroke-width="2.5" stroke-opacity="0.7"/>
</svg>
